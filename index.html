<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF6B4A">
<title>Lembra Aí!</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E9; --card:#fff; --ink:#2B2340; --muted:#7A7189; --soft:#F3EADB;
  --coral:#FF6B4A; --coral-d:#E2502F; --teal:#12B5A5; --teal-d:#0E8F83; --sun:#FFC93C; --lilac:#8B7CF6; --rose:#FF8FB1;
  --r:20px; --sh:0 4px 0 var(--ink);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(40px + var(--safe-b));
  background-image:radial-gradient(circle at 12% 8%,#FFE3C9 0 90px,transparent 91px),radial-gradient(circle at 92% 22%,#E1F7F3 0 70px,transparent 71px);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:540px;margin:0 auto;padding:calc(10px + var(--safe-t)) 16px 0}
h1,h2,h3,.f{font-family:Fredoka,Nunito,system-ui,sans-serif}
.hidden{display:none!important}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px}
.brand{font-family:Fredoka,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.5px}
.brand span{color:var(--coral)}
.brand small{font-size:13px;color:var(--muted);font-weight:600;margin-left:6px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);font-size:20px;display:inline-grid;place-items:center;transition:transform .08s,box-shadow .08s}
.iconbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.top-actions{display:flex;gap:8px}

.preview-banner{background:var(--sun);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;margin:6px 0 10px;box-shadow:var(--sh)}

/* herói */
.hero{display:flex;align-items:flex-end;gap:4px;margin:4px 0 8px;min-height:170px}
.hero-av{width:142px;flex:0 0 142px;height:178px;border:0;background:none;padding:0;position:relative}
.hero-av svg{width:100%;height:100%;overflow:visible}
.hero-av .tap{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;background:var(--ink);color:#fff;border-radius:99px;padding:3px 9px;white-space:nowrap}
.hero{margin-bottom:22px}
.bubble{position:relative;flex:1;background:#fff;border:2px solid var(--ink);border-radius:22px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:60px;font-weight:800;font-size:17px;line-height:1.3;min-height:64px}
.bubble:before{content:"";position:absolute;left:-12px;bottom:18px;width:18px;height:18px;background:#fff;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg);border-radius:0 0 0 5px}
.bubble small{display:block;font-weight:700;color:var(--muted);font-size:13px;margin-top:4px}
.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}

.stats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.stat b{font-family:Fredoka,sans-serif}

.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:16px}

/* setup */
.setup h3{margin:0 0 8px;font-size:18px}
.setup .item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--soft);margin-top:8px;font-weight:800;border:0;width:100%;text-align:left}
.setup .item .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:#fff;font-size:14px;flex:0 0 26px}
.setup .item.ok{opacity:.6}
.setup .item.ok .ck{background:var(--teal);color:#fff}
.setup .item span.go{margin-left:auto;color:var(--coral-d)}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:800;text-decoration:underline;padding:6px 0 0;font-size:13px}

/* compositor */
.comp-row{display:flex;gap:10px;align-items:stretch}
.comp-row textarea{flex:1;border:2px solid var(--ink);border-radius:16px;padding:12px 14px;font-size:17px;font-weight:700;resize:none;min-height:56px;max-height:140px;background:#FFFDF8;outline:none}
.comp-row textarea:focus{border-color:var(--coral);box-shadow:0 0 0 3px #FFD7CC}
.mic{width:60px;flex:0 0 60px;border-radius:18px;border:2px solid var(--ink);background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.mic:active{transform:translateY(4px);box-shadow:none}
.mic svg{width:28px;height:28px}
.prev{margin:10px 2px 2px;font-size:14px;font-weight:800;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;min-height:22px}
.tag{background:var(--soft);border-radius:99px;padding:3px 10px;color:var(--ink)}
.tag.t{background:#FFE6DF}
.tag.w{background:#E1F7F3}
.tag.r{background:#ECE8FF}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:7px 12px;font-weight:800;font-size:14px;box-shadow:0 2px 0 var(--ink)}
.chip.on{background:var(--ink);color:#fff}
.chip:active{transform:translateY(2px);box-shadow:none}
.comp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.btn{border:2px solid var(--ink);border-radius:16px;padding:12px 18px;font-weight:900;font-size:16px;background:#fff;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--coral);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.sun{background:var(--sun)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
input[type=datetime-local],input[type=time],input[type=text],input[type=number],select{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#FFFDF8;font-weight:700;width:100%;outline:none}
.pick{margin-top:10px}

/* abas */
.tabs{display:flex;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:5px;box-shadow:var(--sh);margin:4px 0 14px}
.tabs button{flex:1;border:0;background:none;border-radius:11px;padding:9px 4px;font-weight:900;font-size:15px}
.tabs button.on{background:var(--ink);color:#fff}
.tabs .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--soft);color:var(--ink);font-size:12px;margin-left:4px}

/* lista */
.grp{font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;color:var(--muted);margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.6px}
.grp.late{color:var(--coral-d)}
.task{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 3px 0 var(--ink);animation:slidein .25s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.task .ckb{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:18px;color:#fff;padding:0}
.task.done .ckb{background:var(--teal)}
.task .body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.task .tx{font-weight:900;font-size:16.5px;line-height:1.25;word-break:break-word}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.task .meta{font-size:13px;font-weight:800;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
.task .meta .late{color:var(--coral-d)}
.task .meta .off{color:#9a8fb0}
.task.late{background:#FFF1EC}
.task .bell{width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:2px solid var(--ink);background:var(--soft);font-size:18px;padding:0}
.task .bell.on{background:var(--sun)}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-weight:800}
.empty .big{font-size:44px}

/* folha (bottom sheet) */
.backdrop{position:fixed;inset:0;background:rgba(43,35,64,.45);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-top:2px solid var(--ink);border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;padding:10px 18px calc(24px + var(--safe-b));animation:up .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:52px;height:6px;border-radius:9px;background:#d8ccb8;margin:2px auto 10px}
.sheet h2{margin:4px 0 12px;font-size:22px}
.sheet h3{margin:18px 0 8px;font-size:16px}
.sheet p{line-height:1.45;margin:6px 0}
.sheet .inner{max-width:540px;margin:0 auto}
.field{margin:12px 0}
.field label{display:block;font-weight:900;font-size:14px;margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:11px 12px;margin:8px 0;font-weight:800}
.switch small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.tg{position:relative;width:52px;height:30px;flex:0 0 52px}
.tg input{opacity:0;width:0;height:0}
.tg span{position:absolute;inset:0;background:#d9cfbf;border:2px solid var(--ink);border-radius:99px;transition:.2s}
.tg span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border:2px solid var(--ink);border-radius:50%;transition:.2s;box-sizing:border-box}
.tg input:checked+span{background:var(--teal)}
.tg input:checked+span:before{transform:translateX(22px)}
code.topic{display:block;background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:10px;font-weight:800;font-size:15px;word-break:break-all;margin:6px 0}
.steps{padding-left:20px}
.steps li{margin:8px 0;line-height:1.4}
.note{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0}
.note.warn{background:#FFF1EC}
.note.ok{background:#E1F7F3}
.danger{color:var(--coral-d)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1;min-width:130px}

/* editor do avatar */
.av-stage{display:flex;justify-content:center;background:#fff;border:2px solid var(--ink);border-radius:22px;box-shadow:var(--sh);padding:8px;margin-bottom:12px;position:sticky;top:-10px;z-index:2}
.sheet a{color:var(--coral-d);font-weight:800}
.sheet a.btn{color:var(--ink)}
.av-stage svg{width:170px;height:212px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:7px 11px;font-weight:800;font-size:14px}
.opt.on{background:var(--ink);color:#fff}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);padding:0}
.sw.on{outline:3px solid var(--coral);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--coral)}

/* overlay do lembrete */
.ov{position:fixed;inset:0;z-index:60;background:rgba(43,35,64,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:calc(16px + var(--safe-t)) 16px calc(18px + var(--safe-b));animation:fade .2s}
.ov-inner{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center}
.ov-bubble{background:#fff;border:2.5px solid var(--ink);border-radius:26px;padding:16px 18px;box-shadow:0 5px 0 var(--ink);width:100%;position:relative;animation:pop .45s .15s both cubic-bezier(.3,1.6,.5,1)}
.ov-bubble:after{content:"";position:absolute;bottom:-13px;left:50%;margin-left:-11px;width:22px;height:22px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.ov-kicker{font-family:Fredoka,sans-serif;font-weight:700;color:var(--coral-d);font-size:17px}
.ov-text{font-family:Fredoka,sans-serif;font-weight:700;font-size:27px;line-height:1.15;margin:4px 0 6px;word-break:break-word}
.ov-meta{font-size:13.5px;font-weight:800;color:var(--muted)}
.ov-count{position:absolute;top:10px;right:14px;font-size:12px;font-weight:900;background:var(--soft);border-radius:99px;padding:2px 8px}
.ov-av{width:210px;height:262px;margin-top:6px;animation:rise .6s cubic-bezier(.2,1.4,.4,1)}
.ov-av svg{width:100%;height:100%;overflow:visible}
@keyframes rise{from{transform:translateY(120%)}to{transform:none}}
.ov-actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-10px;position:relative;z-index:2}
.ov-actions .btn{padding:14px 10px;font-size:16px}
.ov-actions .wide{grid-column:1/-1;font-size:19px;padding:16px}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* voz */
.voice{position:fixed;inset:0;z-index:55;background:rgba(43,35,64,.62);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(18px + var(--safe-b));animation:fade .2s}
.voice-card{width:100%;max-width:460px;background:var(--bg);border:2.5px solid var(--ink);border-radius:28px;box-shadow:0 5px 0 var(--ink);padding:18px;text-align:center;animation:up .3s cubic-bezier(.2,1.2,.4,1)}
.voice-av{width:150px;height:186px;margin:0 auto;position:relative}
.voice-av svg{width:100%;height:100%;overflow:visible}
.voice-av .ring{position:absolute;left:50%;top:44%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:4px solid var(--coral);opacity:0;pointer-events:none}
.voice.listening .ring{animation:ring 1.4s infinite}
.voice.listening .ring.b{animation-delay:.7s}
@keyframes ring{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.voice-q{font-family:Fredoka,sans-serif;font-weight:700;font-size:21px;margin-top:14px}
.voice-t{min-height:48px;margin:10px 0;font-weight:800;font-size:18px;color:var(--ink);background:#fff;border:2px dashed #cfc3ae;border-radius:16px;padding:10px}
.voice-t.dim{color:var(--muted)}
.voice-btns{display:flex;gap:10px}
.voice-btns .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;font-weight:800;display:flex;gap:12px;align-items:center;max-width:92vw;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:up .25s}
.toast button{background:var(--sun);color:var(--ink);border:0;border-radius:10px;padding:6px 10px;font-weight:900}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

/* avatar animações */
.av .av-head{transform-box:view-box;transform-origin:100px 182px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) translateY(-2px)}}
.av .eyes{transform-box:view-box;transform-origin:100px 98px;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.av .mouth-talk{transform-box:view-box;transform-origin:100px 142px;animation:talk .2s infinite alternate}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.1)}}
.av .arm{transform-box:view-box;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.av .arm-l{transform-origin:66px 206px}
.av .arm-r{transform-origin:134px 206px}
.av.m-party .arm-l{transform:rotate(140deg)}
.av.m-party .arm-r{transform:rotate(-140deg)}
.av.m-party .av-head{animation:party .5s ease-in-out infinite alternate}
@keyframes party{from{transform:rotate(-7deg) translateY(-2px)}to{transform:rotate(7deg) translateY(-6px)}}
.av.m-alert .arm-r,.av.m-angry .arm-r{animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-155deg)}to{transform:rotate(-115deg)}}
.av.m-angry .av-head{animation:shakehead .35s ease-in-out infinite alternate}
@keyframes shakehead{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.av.m-listen .arm-r{transform:rotate(-120deg)}
.av.m-sleep .av-head{animation:bob 6s ease-in-out infinite}
.av.m-sleep .eyes{animation:none}
.av .stk{animation:float 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.av .parm{transform-box:view-box}
.av .parm-l{transform-origin:47px 226px}
.av .parm-r{transform-origin:153px 226px}
.av.m-alert .parm-r,.av.m-talk .parm-r{animation:pwig .45s ease-in-out infinite alternate}
.av.m-party .parm-l{animation:pwig .4s ease-in-out infinite alternate}
.av.m-party .parm-r{animation:pwig .4s ease-in-out .2s infinite alternate}
.av.m-angry .parm-l{animation:pdown .32s ease-in-out infinite alternate}
.av.av-pereira.m-angry .av-head{animation:shakehead .6s ease-in-out infinite alternate}
@keyframes pwig{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes pdown{from{transform:translateY(-2px) rotate(-3deg)}to{transform:translateY(4px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.av *{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Lembra<span>Aí!</span></div>
    <div class="top-actions">
      <button class="iconbtn hidden" id="btnInstall" title="Instalar app" aria-label="Instalar app">📲</button>
      <button class="iconbtn" id="btnSettings" title="Configurações" aria-label="Configurações">⚙️</button>
    </div>
  </header>
  <div id="previewBanner" class="preview-banner hidden">👀 Isto é uma prévia. Aqui dentro do Claude a voz e as notificações ficam bloqueadas — no app instalado no celular tudo funciona.</div>

  <section class="hero">
    <button class="hero-av" id="heroAv" aria-label="Tocar para falar com o bonequinho"></button>
    <div class="bubble" id="heroBubble"></div>
  </section>

  <div class="stats" id="stats"></div>
  <section class="card setup hidden" id="setupCard"></section>

  <section class="card">
    <div class="comp-row">
      <textarea id="inp" rows="1" placeholder="Ex.: me lembra de pagar a luz amanhã às 10h" enterkeyhint="done" aria-label="Escreva o lembrete"></textarea>
      <button class="mic" id="mic" aria-label="Falar o lembrete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg>
      </button>
    </div>
    <div class="prev" id="prev"></div>
    <div class="chips" id="whenChips"></div>
    <div class="pick hidden" id="pickWrap"><input type="datetime-local" id="pickDt" aria-label="Escolher data e hora"></div>
    <div class="comp-foot">
      <button class="chip" id="repChip" title="Toque para mudar de quanto em quanto tempo avisar">🔁 a cada 1 h</button>
      <button class="btn primary" id="addBtn">Lembrar ➜</button>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-tab="todo" class="on">A fazer<span class="n" id="nTodo">0</span></button>
    <button data-tab="done">Feitas<span class="n" id="nDone">0</span></button>

/* ============ ntfy: avisos no celular com o app fechado ============ */
const APP_URL = location.origin + location.pathname.replace(/index\.html$/, '');
const ICON_URL = new URL('icon-192.png', location.href).href;
function ntBase() { return (S.settings.ntfy.server || 'https://ntfy.sh').replace(/\/+$/, ''); }
function seqFor(t, at) { return 'la' + t.id + 'x' + Math.floor(at / MIN).toString(36); }
function payloadFor(t, at, topic) {
  const n = ordinal(t, at), q = encodeURIComponent(t.id);
  const tp = encodeURIComponent(topic), a = Math.floor(t.anchor / MIN).toString(36), e = t.every || 0;
  const extra = `&tp=${tp}&a=${a}&e=${e}`;
  return {
    topic, title: notifTitle(n), message: t.text + (t.dueAt < at - 2 * MIN ? `\n(marcado ${fmtAt(t.dueAt, at)})` : ''),
    priority: S.settings.strong ? (n >= 4 ? 5 : 4) : 4,
    click: `${APP_URL}?acao=ver&id=${q}${extra}`, icon: ICON_URL,
    actions: [
      { action: 'view', label: '✅ Feito', url: `${APP_URL}?acao=feito&id=${q}${extra}`, clear: true },
      { action: 'view', label: '🔕 Parar avisos', url: `${APP_URL}?acao=parar&id=${q}${extra}`, clear: true }
    ],
    sequence_id: seqFor(t, at)
  };
}
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h.toString(36); }
function countSent() { const nt = S.settings.ntfy; const d = new Date().toDateString(); if (nt.day !== d) { nt.day = d; nt.sent = 0; } nt.sent++; }
async function ntfyFetch(url, opts) {
  try {
    const r = await fetch(url, Object.assign({ cache: 'no-store' }, opts));
    if (r.status === 429) { S.settings.ntfy.err = 'Limite diário do ntfy atingido. Volta ao normal em algumas horas.'; throw new Error('429'); }
    if (r.status === 404 && /\/delete$/.test(url)) return true;
    if (!r.ok) { S.settings.ntfy.err = 'Erro ' + r.status + ' do servidor ntfy'; throw new Error('http ' + r.status); }
    return true;
  } catch (e) {
    if (e && /^(429|http)/.test(e.message)) throw e;
    // CORS ou rede: tenta modo "no-cors" (a mensagem chega, só não dá pra ler a resposta)
    if (!navigator.onLine) { S.settings.ntfy.err = 'Sem internet agora'; throw e; }
    await fetch(url, Object.assign({ mode: 'no-cors', cache: 'no-store' }, opts));
    return 'opaque';
  }
}
async function ntPublish(body) {
  countSent();
  return ntfyFetch(ntBase() + '/', { method: 'POST', body: JSON.stringify(body) });
}
async function ntDelete(topic, seq) {
  countSent();
  return ntfyFetch(ntBase() + '/' + encodeURIComponent(topic) + '/' + encodeURIComponent(seq) + '/delete', { method: 'GET' });
}
let syncing = false, resync = false, syncTimer = null;
function ntfySync() { clearTimeout(syncTimer); syncTimer = setTimeout(ntfySyncNow, 600); }
async function ntfySyncNow() {
  if (PREVIEW) return;
  if (syncing) { resync = true; return; }
  syncing = true;
  try {
    const nt = S.settings.ntfy; const on = nt.on && !!nt.topic;
    const now = Date.now(), horizon = now + 3 * DAY - 10 * MIN;
    const ops = [];
    for (const t of S.tasks) {
      t.nt = (t.nt || []).filter((x) => x.at > now - 12 * HOUR || !x.del);
      const want = on && isActive(t) ? slotsBetween(t, now + 15000, horizon, Math.max(1, Math.min(48, nt.ahead || 12))) : [];
      const wantMap = new Map(want.map((at) => [seqFor(t, at), at]));
      for (const x of t.nt) {
        if (x.at > now && (!wantMap.has(x.seq) || x.topic !== nt.topic || !on)) ops.push({ k: 'del', t, x });
        else if (x.at <= now && !isActive(t) && !x.cleared && x.at > now - 12 * HOUR) ops.push({ k: 'del', t, x, delivered: true });
      }
      if (on) for (const [seq, at] of wantMap) {
        const body = payloadFor(t, at, nt.topic);
        if (at - Date.now() > 12000) body.delay = String(Math.floor(at / 1000));
        const h = hashStr(JSON.stringify(Object.assign({}, body, { delay: '' })));
        const ex = t.nt.find((x) => x.seq === seq && x.topic === nt.topic);
        if (!ex || ex.h !== h) ops.push({ k: 'pub', t, seq, at, body, h });
      }
    }
    for (const op of ops) {
      try {
        if (op.k === 'pub') {
          await ntPublish(op.body);
          const ex = op.t.nt.find((x) => x.seq === op.seq && x.topic === op.body.topic);
          if (ex) { ex.h = op.h; ex.at = op.at; } else op.t.nt.push({ seq: op.seq, at: op.at, h: op.h, topic: op.body.topic });
        } else {
          await ntDelete(op.x.topic, op.x.seq);
          if (op.delivered) op.x.cleared = true; else op.t.nt = op.t.nt.filter((y) => y !== op.x);
        }
        S.settings.ntfy.err = '';
      } catch (e) { if (/429/.test(e.message)) break; }
      await sleep(220);
    }
    S.tasks = S.tasks.filter((t) => !(t.deleted && !(t.nt || []).some((x) => x.at > Date.now())));
    S.settings.ntfy.lastSync = Date.now();
  } finally {
    syncing = false; saveNow();
    if (resync) { resync = false; ntfySync(); }
  }
}
// canal de controle: ações feitas por fora (botões da notificação abertos em outro navegador)
async function ctlSend(acao, id) {
  const nt = S.settings.ntfy; if (!nt.on || PREVIEW) return;
  try { await ntPublish({ topic: nt.topic + '-ctl', message: acao + ':' + id }); } catch (e) {}
}
async function ctlPoll() {
  const nt = S.settings.ntfy; if (!nt.on || PREVIEW) return;
  try {
    const since = nt.ctlSince ? Math.floor(nt.ctlSince / 1000) : '12h';
    const r = await fetch(ntBase() + '/' + encodeURIComponent(nt.topic + '-ctl') + '/json?poll=1&since=' + since, { cache: 'no-store' });
    if (!r.ok) return;
    const lines = (await r.text()).split('\n').filter(Boolean);
    let changed = false;
    for (const ln of lines) {
      let m; try { m = JSON.parse(ln); } catch (e) { continue; }
      if (m.event !== 'message' || !m.message) continue;
      nt.ctlSince = Math.max(nt.ctlSince || 0, (m.time || 0) * 1000 + 1000);
      const [acao, id] = m.message.split(':');
      const t = getTask(id); if (!t) continue;
      if (acao === 'feito' && !t.done) { markDone(t, { quiet: true }); changed = true; }
      if (acao === 'parar' && t.alarm) { muteTask(t, { quiet: true }); changed = true; }
    }
    if (changed) save();
  } catch (e) {}
}
async function ntfyTest() {

/* ============ ações vindas de URL / notificação ============ */
async function handleAction(acao, id, params) {
  const t = id ? getTask(id) : null;
  if (acao === 'voz') { openVoice(true); return; }
  if (!t) {
    // tarefa não existe neste navegador: cancela a série direto no ntfy e avisa o app principal
    if (params && params.get('tp') && (acao === 'feito' || acao === 'parar')) {
      const topic = params.get('tp'), a = parseInt(params.get('a'), 36) * MIN, e = (+params.get('e') || 0) * MIN;
      const fake = { id, anchor: a }; const now = Date.now();
      try { await ntfyFetch(ntBase() + '/', { method: 'POST', body: JSON.stringify({ topic: topic + '-ctl', message: acao + ':' + id }) }); } catch (er) {}
      const slots = []; if (e) { for (let at = a + Math.max(0, Math.ceil((now - a) / e)) * e, i = 0; i < 30 && at < now + 3 * DAY; at += e, i++) slots.push(at); } else if (a > now) slots.push(a);
      for (const at of slots) { try { await ntfyFetch(ntBase() + '/' + encodeURIComponent(topic) + '/' + seqFor(fake, at) + '/delete', { method: 'GET' }); } catch (er) {} await sleep(150); }
      say(acao === 'feito' ? 'Feito! Cancelei os próximos avisos 🎉' : 'Parei os avisos 🔕', acao === 'feito' ? 'party' : 'normal', 5000, true);
      if (acao === 'feito') celebrate();
    } else if (id) toast('Essa tarefa não está mais na lista.');
    return;
  }
  if (acao === 'feito') { markDone(t); ctlSend('feito', t.id); }
  else if (acao === 'parar') { muteTask(t); ctlSend('parar', t.id); }
  else if (acao === 'ver') { if (!t.done) { const s = lastSlotUpTo(t, Date.now()) || t.dueAt; t.shown = s; queueOverlay(t, s); } else openTask(t); }
}
function handleUrl() {
  const p = new URLSearchParams(location.search);
  const acao = p.get('acao'); if (!acao) return;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  setTimeout(() => handleAction(acao, p.get('id'), p), 350);
}

/* ============ voz (tipo Alexa) ============ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, voiceMode = 'new', voicePending = null, voiceFinal = '', voiceTimer = null;
function voiceUI(state, q, t, btns) {
  const v = $('#voice'); v.classList.remove('hidden'); v.classList.toggle('listening', state === 'listen');
  $('#voiceAv').innerHTML = avatarSVG(S.avatar, state === 'listen' ? 'listen' : state === 'ok' ? 'happy' : state === 'err' ? 'worried' : 'talk');
  if (q != null) $('#voiceQ').innerHTML = q;
  if (t != null) { $('#voiceT').innerHTML = t || '…'; $('#voiceT').classList.toggle('dim', !t); }
  $('#voiceBtns').innerHTML = (btns || []).map((b, i) => `<button class="btn ${b.cls || ''}" data-vb="${i}">${b.l}</button>`).join('');
  $$('#voiceBtns [data-vb]').forEach((el) => el.onclick = () => btns[+el.dataset.vb].f());
}
function closeVoice() { clearTimeout(voiceTimer); try { rec && rec.abort(); } catch (e) {} rec = null; $('#voice').classList.add('hidden'); voicePending = null; voiceMode = 'new'; render(); }
function openVoice(needTap) {
  audio();
  if (!SR) {
    voiceUI('err', 'Meu ouvido não funciona aqui 🙉', PREVIEW ? 'Na prévia dentro do Claude o microfone é bloqueado. No app instalado (Chrome) funciona.' : 'Este navegador não liberou o reconhecimento de voz. Dica: toque na caixa de texto e use o 🎤 do teclado — eu entendo do mesmo jeito!', [
      { l: 'Usar teclado', cls: 'primary', f: () => { closeVoice(); $('#inp').focus(); } }, { l: 'Fechar', f: closeVoice }]);
    return;
  }
  if (needTap) { voiceUI('idle', 'Fala comigo! 🎧', 'Toque em “Falar” e diga o lembrete.', [{ l: 'Cancelar', f: closeVoice }, { l: '🎤 Falar', cls: 'primary', f: () => listen('new') }]); return; }
  listen('new');
}
function listen(mode) {
  voiceMode = mode; voiceFinal = '';
  try { speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
  try { rec && rec.abort(); } catch (e) {}
  rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  const q = mode === 'when' ? `Pra quando? ⏰` : `Fala que o ${esc(BOT())} anota! 🎧`;
  const hint = mode === 'when' ? 'Ex.: “às 3 da tarde”, “amanhã de manhã”, “daqui a 20 minutos”' : 'Ex.: “me lembra de tirar o lixo às 8 da noite”';
  voiceUI('listen', q, `<span style="color:var(--muted)">${hint}</span>`, [{ l: 'Cancelar', f: closeVoice }, { l: '✋ Pronto', cls: 'primary', f: () => { try { rec.stop(); } catch (e) {} } }]);
  rec.onresult = (e) => {
    let fin = '', inter = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) fin += r[0].transcript; else inter += r[0].transcript; }
    if (fin) voiceFinal += fin;
    $('#voiceT').classList.remove('dim'); $('#voiceT').textContent = (voiceFinal + ' ' + inter).trim() || '…';
  };
  rec.onerror = (e) => {
    rec._err = e.error;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') voiceUI('err', 'Preciso do microfone 🎙️', 'Libera o microfone pro app (no Chrome: cadeado ao lado do endereço → Permissões → Microfone). Ou use o 🎤 do teclado.', [{ l: 'Fechar', f: closeVoice }, { l: 'Tentar de novo', cls: 'primary', f: () => listen(mode) }]);
    else if (e.error === 'no-speech') voiceUI('err', 'Não ouvi nada 🙉', 'Tenta de novo, mais pertinho.', [{ l: 'Cancelar', f: closeVoice }, { l: '🎤 De novo', cls: 'primary', f: () => listen(mode) }]);
    else if (e.error !== 'aborted') voiceUI('err', 'Deu ruim no microfone 😅', 'Erro: ' + esc(e.error) + '. Tenta de novo ou use o teclado.', [{ l: 'Fechar', f: closeVoice }, { l: '🎤 De novo', cls: 'primary', f: () => listen(mode) }]);
  };
  rec.onend = () => { if (rec && rec._err) return; handleVoice(voiceFinal.trim() || $('#voiceT').textContent.replace(/^…$/, '').trim()); };
  try { rec.start(); chime('listen'); buzz(25); } catch (e) { voiceUI('err', 'Não consegui abrir o microfone', esc(e.message || ''), [{ l: 'Fechar', f: closeVoice }]); }
}
function readAgenda() {
  const now = Date.now();
  const pend = S.tasks.filter((t) => !t.deleted && !t.done).sort((a, b) => a.dueAt - b.dueAt);
  const hoje = pend.filter((t) => dayDiff(t.dueAt) <= 0);
  if (!pend.length) return { txt: 'Você não tem nada pendente. Tudo em dia! 😎', speak: 'Você não tem nada pendente. Tudo em dia!' };
  const list = (hoje.length ? hoje : pend).slice(0, 5);
  const fala = (hoje.length ? `Pra hoje você tem ${hoje.length}: ` : `Hoje está livre. Próximas: `) + list.map((t) => t.text + (t.dueAt > now ? ', ' + spokenWhen(t.dueAt) : ', atrasada')).join('; ');
  return { txt: list.map((t) => `• ${esc(t.text)} <small style="color:var(--muted)">${t.dueAt <= now ? '⚠️ atrasada' : fmtWhen(t.dueAt)}</small>`).join('<br>'), speak: fala };
}
function handleVoice(text) {
  if (!text) { voiceUI('err', 'Não ouvi nada 🙉', 'Tenta de novo?', [{ l: 'Cancelar', f: closeVoice }, { l: '🎤 De novo', cls: 'primary', f: () => listen(voiceMode) }]); return; }
  const low = text.toLowerCase();
  if (voiceMode === 'new' && /^(?:o que|oque|quais?|qual)\b.*\b(?:tenho|tem|pendente|tarefas?|lembretes?|agenda|pra hoje|hoje)\b/.test(low)) {
    const a = readAgenda(); voiceUI('ok', 'Sua lista 📋', a.txt, [{ l: 'Fechar', cls: 'primary', f: closeVoice }]); speak(a.speak, true); return;
  }
  if (voiceMode === 'when' && voicePending) {
    const p = parseTask(text);
    let due = p.due ?? (p.every ? Date.now() + p.every * MIN : null);
    if (!due) {
      const m = low.match(/\d{1,2}/);
      if (m) due = parseTask('às ' + m[0] + 'h').due;
    }
    if (!due) due = Date.now() + HOUR;
    finishVoiceTask(Object.assign({}, voicePending, { due, every: p.every ?? voicePending.every, recur: p.recur || voicePending.recur }));
    return;
  }
  const p = parseTask(text);
  const ttext = p.text || cap1(text);
  if (!p.due && p.every == null && !p.recur) {
    voicePending = { text: ttext, every: null, recur: null };
    speak('Pra quando?', true);
    setTimeout(() => listen('when'), 900);
    voiceUI('talk', 'Pra quando? ⏰', `📝 ${esc(ttext)}`, []);
    return;
  }
  finishVoiceTask({ text: ttext, due: p.due ?? Date.now() + (p.every || 60) * MIN, every: p.every, recur: p.recur });
}
function finishVoiceTask(d) {
  const every = d.every ?? S.settings.every;
  const t = addTask({ text: d.text, due: d.due, every, recur: d.recur });
  voicePending = null;
  chime('add'); buzz(30);
  const line = `<b>${esc(t.text)}</b><br><small style="color:var(--muted)">⏰ ${fmtWhen(t.dueAt)} · 🔁 ${fmtEvery(every)}${t.recur !== 'none' ? ' · ♻️ ' + RECUR_SHORT[t.recur] : ''}</small>`;
  voiceUI('ok', 'Anotado! ✅', line, [
    { l: 'Desfazer', f: () => { S.tasks = S.tasks.filter((x) => x !== t); save(); ntfySync(); closeVoice(); toast('Lembrete apagado'); } },
    { l: 'Editar', f: () => { closeVoice(); openTask(t); } },
    { l: '👍 OK', cls: 'primary', f: closeVoice }
  ]);
  speak(`Beleza! Vou te lembrar de ${t.text}, ${spokenWhen(t.dueAt)}.`, true);
  clearTimeout(voiceTimer); voiceTimer = setTimeout(() => { if (!$('#voice').classList.contains('hidden') && $('#voiceQ').textContent.startsWith('Anotado')) closeVoice(); }, 7000);
  afterFirstTask();
}

  openSheet(`
    <h2>🔔 Avisos com o app fechado</h2>
    <p>O navegador sozinho só consegue te avisar com o app aberto. Pra eu te cutucar <b>de hora em hora mesmo com o celular bloqueado</b>, uso o <b>ntfy</b> — um app de notificações gratuito e de código aberto.</p>
    <ol class="steps">
      <li>Instale o app <b>ntfy</b>: <a href="https://play.google.com/store/apps/details?id=io.heckel.ntfy" target="_blank" rel="noopener">Play Store (Android)</a> · <a href="https://ntfy.sh" target="_blank" rel="noopener">iPhone</a></li>
      <li>Abra o ntfy, toque no <b>+</b> e inscreva-se neste tópico (é a sua “senha”, não compartilhe):
        <code class="topic" id="nTopic">${esc(nt.topic)}</code>
        <div class="btnrow" style="margin-top:4px"><button class="btn sm" id="nCopy">📋 Copiar tópico</button><a class="btn sm" style="text-decoration:none;text-align:center" href="ntfy://${esc(host)}/${esc(nt.topic)}">📲 Abrir no ntfy</a></div>
      </li>
      <li>Volte aqui e toque em <b>Enviar teste</b>. Chegou a notificação? Pronto! 🎉</li>
    </ol>
    <div class="btnrow"><button class="btn primary block" id="nTest">🚀 Enviar teste</button></div>
    <div id="nStatus"></div>
    <label class="switch"><span>Avisos pelo ntfy<small>${nt.on ? 'Ligado' : 'Desligado'}</small></span><span class="tg"><input type="checkbox" id="nOn" ${nt.on ? 'checked' : ''}><span></span></span></label>
    <div class="note"><b>📱 Xiaomi / POCO (importante):</b> em <i>Configurações → Apps → Gerenciar apps → ntfy</i>: <b>Início automático</b> ligado, <b>Economia de bateria → Sem restrições</b>, e em <b>Notificações</b> libere tudo (tela de bloqueio, pop-up/flutuante, som). Faça o mesmo pro <b>Chrome</b>. Senão o sistema “mata” os avisos pra economizar bateria.</div>
    <h3>Avançado</h3>
    <div class="field"><label>Avisos deixados agendados por tarefa (renovo sempre que você abre o app)</label><input type="number" id="nAhead" min="3" max="48" value="${nt.ahead}"></div>
    <div class="field"><label>Servidor</label><input type="text" id="nServer" value="${esc(nt.server)}"></div>
    <div class="btnrow"><button class="btn ghost" id="nNew">🔄 Gerar tópico novo</button></div>
    <p style="font-size:12.5px;color:var(--muted)">Hoje: ${nt.day === new Date().toDateString() ? nt.sent : 0} envios ao ntfy. O plano grátis tem limite diário; por isso deixo no máximo ${nt.ahead} avisos agendados por tarefa e renovo quando você abre o app.</p>
  `, (el) => {
    const status = () => { $('#nStatus', el).innerHTML = nt.err ? `<div class="note warn">⚠️ ${esc(nt.err)}</div>` : nt.ok ? `<div class="note ok">✅ Último teste enviado ${fmtWhen(nt.ok)}. Se não chegou no ntfy, confere se o tópico está igualzinho.</div>` : ''; };
    status();
    $('#nCopy', el).onclick = () => {
      const txt = nt.topic;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('📋 Tópico copiado')).catch(() => { const r = document.createRange(); r.selectNodeContents($('#nTopic', el)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selecionei o tópico — copie manualmente'); });
    };
    $('#nTest', el).onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = '⏳ Enviando…';
      const ok = await ntfyTest();
      e.target.disabled = false; e.target.textContent = '🚀 Enviar teste';
      if (ok) { $('#nOn', el).checked = true; say('Mandei! Olha o ntfy 📲', 'happy', 3500); }
      status(); renderSetup();
    };
    $('#nOn', el).onchange = (e) => { nt.on = e.target.checked; saveNow(); ntfySync(); };
    $('#nAhead', el).onchange = (e) => { nt.ahead = Math.max(3, Math.min(48, +e.target.value || 12)); saveNow(); ntfySync(); };
    $('#nServer', el).onchange = (e) => { const v = e.target.value.trim(); if (/^https?:\/\//.test(v)) { nt.server = v; saveNow(); ntfySync(); } };
    let armed = false;
    $('#nNew', el).onclick = (e) => {
      if (!armed) { armed = true; e.target.textContent = '⚠️ Toque de novo (vai precisar inscrever de novo no ntfy)'; return; }
      nt.topic = genTopic(); nt.ok = 0; saveNow(); ntfySync(); closeSheet(); openNtfy();
    };
  });
}

/* ============ instalação ============ */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; $('#btnInstall').classList.remove('hidden'); });
window.addEventListener('appinstalled', () => { S.installed = true; save(); $('#btnInstall').classList.add('hidden'); renderSetup(); toast('📲 Instalado! Agora eu moro na sua tela inicial.'); });
async function openInstall() {
  if (deferredPrompt) { deferredPrompt.prompt(); const r = await deferredPrompt.userChoice.catch(() => null); deferredPrompt = null; if (r && r.outcome === 'accepted') { S.installed = true; save(); renderSetup(); } return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  openSheet(`<h2>📲 Instalar na tela inicial</h2>
    ${isStandalone() ? '<div class="note ok">✅ Você já está usando o app instalado!</div>' : ''}
    ${ios ? `<ol class="steps"><li>Abra este endereço no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> (quadrado com seta).</li><li>Escolha <b>Adicionar à Tela de Início</b>.</li></ol>`
    : `<ol class="steps"><li>Abra este endereço no <b>Chrome</b>.</li><li>Toque nos <b>⋮</b> (canto de cima).</li><li>Escolha <b>Instalar app</b> (ou <i>Adicionar à tela inicial → Instalar</i>).</li><li>Abra o <b>Lembra Aí!</b> pelo ícone novo.</li></ol>
    <div class="note">Dica: segure o dedo no ícone do app → <b>Falar um lembrete</b> abre direto o microfone. Tipo Alexa 😉</div>`}
    <div class="btnrow"><button class="btn" id="iDone">Já instalei</button><button class="btn primary" id="iOk">Fechar</button></div>`, (el) => {
    $('#iDone', el).onclick = () => { S.installed = true; save(); closeSheet(); };
    $('#iOk', el).onclick = closeSheet;
  });
}

/* ============ inicialização ============ */
function bind() {
  const ta = $('#inp');
  ta.addEventListener('input', () => { autoGrow(); renderComposer(); });
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitComposer(); } });
  $('#addBtn').onclick = submitComposer;
  $('#mic').onclick = () => openVoice(false);
  $('#heroAv').onclick = () => openVoice(false);
  $('#repChip').onclick = () => {
    const p = parseTask(ta.value); const cur = compEvery ?? (p.every ?? S.settings.every);
    const i = EVERY_OPTS.indexOf(cur); compEvery = EVERY_OPTS[(i + 1) % EVERY_OPTS.length]; renderComposer();
  };
  $('#pickDt').onchange = () => { compWhenKey = 'pick'; compWhen = fromLocalInput($('#pickDt').value); renderComposer(); };
  $('#btnSettings').onclick = openSettings;
  $('#btnInstall').onclick = openInstall;
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); render(); ntfySync(); ctlPoll(); } });
  document.addEventListener('pointerdown', () => { audio(); if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }, { once: true });
  if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'acao') handleAction(e.data.acao, e.data.id); });
}
async function init() {
  if (PREVIEW) $('#previewBanner').classList.remove('hidden');
  bind();
  render(); renderComposer();
  if (!PREVIEW && 'serviceWorker' in navigator) {
    try { reg = await navigator.serviceWorker.register('sw.js'); } catch (e) { reg = null; }
  }
  handleUrl();
  setInterval(tick, 5000); setTimeout(tick, 800);
  setInterval(() => { ntfySync(); }, 30 * MIN);
  setInterval(() => { if (document.visibilityState === 'visible') renderList(); }, 60000);
  ntfySync(); ctlPoll();
  if (!S._welcomed) {
    S._welcomed = true; save();
    setTimeout(() => say(`Oi, ${esc(S.settings.name)}! Eu sou o ${esc(BOT())}, teu lembrador oficial 👋<small>Toque em mim e fala o que eu te lembro.</small>`, 'party', 6000), 400);
  }
  // pede permissão de notificação do navegador no 1º toque (backup quando o ntfy não está ligado)
  if (!PREVIEW && 'Notification' in window && Notification.permission === 'default') {
    document.addEventListener('click', function ask() { document.removeEventListener('click', ask); try { Notification.requestPermission(); } catch (e) {} }, { once: true });
  }
}
window.__LA = { get S() { return S; }, parseTask, slotsBetween, lastSlotUpTo, ntfySyncNow, tick, handleAction, avatarSVG, payloadFor, inQuiet };
init();
})();
</script>
